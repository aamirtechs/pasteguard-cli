[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pasteguard-cli"
version = "1.0.0"
description = "Scan files and stdin for PII and secrets before sharing or committing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amir Hussain" }]

[project.scripts]
pasteguard = "pasteguard_cli:main"

[tool.setuptools]
py-modules = ["pasteguard_cli"]
